
services:

  user-db:
    image: mysql:8.0
    container_name: shopease-user-db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3308:3306"

    volumes:
      - user_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  user-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shopease-user-api
    restart: always

    ports:
      - "8005:8005"

    environment:
      DB_HOST: user-db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      AUTH_SERVICE_URL: http://host.docker.internal:8004
      APP_NAME: ShopEase User Management Service
      APP_VERSION: 1.0.0
      DEBUG: "False"

    depends_on:
      user-db:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"


volumes:
  user_mysql_data:
